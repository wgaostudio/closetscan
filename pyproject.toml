[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "closetscan"
version = "0.1.0"
description = "Turn closet walkthrough videos into a wardrobe catalogue and local MCP tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Will Gao"}]
keywords = ["wardrobe", "catalogue", "video", "mcp", "computer-vision"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/YOUR-GITHUB-USERNAME/closetscan"
Repository = "https://github.com/YOUR-GITHUB-USERNAME/closetscan"
Issues = "https://github.com/YOUR-GITHUB-USERNAME/closetscan/issues"

[project.optional-dependencies]
# vision and narration extend the pipeline rather than standing alone: every
# module they add to reaches cv2/numpy/requests on import, so installing either
# by itself would fail at the first import.
pipeline = ["opencv-python>=4.9", "numpy>=1.26", "scikit-learn>=1.4", "scipy>=1.11", "requests>=2.31"]
vision = ["closetscan[pipeline]", "torch", "torchvision", "transformers>=4.40,<5"]
narration = ["closetscan[pipeline]", "faster-whisper>=1.0"]

[project.scripts]
closetscan-mcp = "closetscan.mcp_server:main"

[tool.setuptools.packages.find]
include = ["closetscan*"]
